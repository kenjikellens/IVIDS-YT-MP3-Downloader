<!--
  Workflow Pipeline pagina fragment (pipeline.html)
  Dit is de gecombineerde download- en sorteer-pipeline interface. Het stelt gebruikers in staat
  om een YouTube link op te geven en de downloads automatisch te laten taggen en ordenen door AI.
-->


<header class="page-header">
    <h1 data-i18n="pipeline_header">Download & Sorteer Pipeline</h1>
</header>


<div class="app-layout pipeline-layout">
    <!-- Left Column: Pipeline Steps Configuration Timeline -->
    <div class="pipeline-config-column timeline-container">
        
        <!-- Step 1: Input Source and Preview checklist -->
        <div class="timeline-item active" id="timeline-step-1">
            <div class="timeline-badge"></div>
            <section class="card config-panel">
                <h3 class="timeline-item-title">
                    <span style="color: var(--accent-green);">Stap 1:</span> YouTube Bron & Preview
                </h3>
                
                <div class="form-row vertical-row">
                    <label for="pipeline-url-input">YouTube URL / Afspeellijst</label>
                    <input type="text" id="pipeline-url-input" placeholder="Paste playlist or video link here..." autocomplete="off" style="width: 100%; padding: 8px; border: 1px solid var(--border-default); border-radius: 6px;">
                    <!-- Status feedback for loading playlist -->
                    <div id="pipeline-url-status" style="display: none; font-size: 11px; margin-top: 6px; font-weight: 500;"></div>
                    <!-- Open preview modal popup button -->
                    <div class="form-row vertical-row" id="pipeline-preview-trigger-container" style="display: none; margin-top: 12px; width: 100%;">
                        <button class="btn-browse btn-full" id="btn-pipeline-open-preview" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            </svg>
                            Afspeellijst Preview openen (<span id="pipeline-preview-count-badge">0</span> video's)
                        </button>
                    </div>
                </div>

                <!-- Custom folder selection for Step 1 -->
                <div class="form-row vertical-row" style="margin-top: 16px;">
                    <div class="form-row checkbox-row" style="margin: 0 0 8px 0;">
                        <input type="checkbox" id="pipeline-enable-downloader" checked>
                        <label for="pipeline-enable-downloader" style="font-weight: 500;">Video's downloaden (Stap 1 activeren)</label>
                    </div>
                    <div id="pipeline-downloader-settings" class="form-row vertical-row" style="margin: 0; display: flex;">
                        <label>Tijdelijke Downloadmap</label>
                        <div class="dir-row">
                            <div class="dir-path" id="pipeline-download-path">Loading...</div>
                            <button class="btn-browse" id="btn-pipeline-browse-download">Browse</button>
                            <input type="file" id="pipeline-download-input" webkitdirectory directory style="display: none;">
                        </div>
                    </div>
                </div>
                
                <div class="form-row vertical-row" style="margin-top: 16px;">
                    <button class="btn-download btn-full" id="btn-pipeline-load-info">Toon Preview</button>
                </div>
            </section>
        </div>
        
        <!-- Step 2: Format & Download Settings -->
        <div class="timeline-item" id="timeline-step-2">
            <div class="timeline-badge"></div>
            <section class="card config-panel">
                <h3 class="timeline-item-title">
                    <span style="color: var(--accent-green);">Stap 2:</span> Formaat & Kwaliteit
                </h3>
                
                <div id="pipeline-format-settings">
                    <div class="form-row vertical-row">
                        <label for="pipeline-media-type-select">Media Type</label>
                        <div class="media-type-select-wrapper">
                            <select id="pipeline-media-type-select">
                                <option value="audio" selected>🎵 Audio</option>
                                <option value="video">🎬 Video</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- Pipeline Audio/Video settings toggled dynamically -->
                    <div id="pipeline-audio-options" style="display: contents;">
                        <div class="form-row vertical-row" style="margin-top: 12px;">
                            <label for="pipeline-format-select">Audio Format</label>
                            <div class="media-type-select-wrapper">
                                <select id="pipeline-format-select">
                                    <option value="mp3" selected>MP3</option>
                                    <option value="m4a">M4A</option>
                                    <option value="wav">WAV</option>
                                    <option value="opus">Opus</option>
                                    <option value="best">Original (No Transcoding)</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row vertical-row" style="margin-top: 12px;">
                            <label for="pipeline-quality-select">Audio Quality</label>
                            <div class="media-type-select-wrapper">
                                <select id="pipeline-quality-select">
                                    <option value="320k">320 kbps (best transcode)</option>
                                    <option value="256k">256 kbps (very high)</option>
                                    <option value="192k" selected>192 kbps (high)</option>
                                    <option value="128k">128 kbps (medium)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div id="pipeline-video-options" style="display: none;">
                        <div class="form-row vertical-row" style="margin-top: 12px;">
                            <label for="pipeline-video-format">Video Format</label>
                            <div class="media-type-select-wrapper">
                                <select id="pipeline-video-format">
                                    <option value="mp4" selected>MP4</option>
                                    <option value="webm">WebM</option>
                                    <option value="mkv">MKV</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row vertical-row" style="margin-top: 12px;">
                            <label for="pipeline-video-quality">Video Quality</label>
                            <div class="media-type-select-wrapper">
                                <select id="pipeline-video-quality">
                                    <option value="best" selected>Best Available</option>
                                    <option value="2160">4K (2160p)</option>
                                    <option value="1440">1440p</option>
                                    <option value="1080">1080p (Full HD)</option>
                                    <option value="720">720p (HD)</option>
                                    <option value="480">480p (SD)</option>
                                    <option value="360">360p</option>
                                    <option value="240">240p</option>
                                    <option value="144">144p</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <!-- Step 3: Sortering & AI Categorisation -->
        <div class="timeline-item" id="timeline-step-3">
            <div class="timeline-badge"></div>
            <section class="card config-panel">
                <h3 class="timeline-item-title">
                    <span style="color: var(--accent-green);">Stap 3:</span> AI Sortering & Organisatie
                </h3>
                
                <div class="form-row checkbox-row" style="margin: 0 0 12px 0;">
                    <input type="checkbox" id="pipeline-enable-organiser" checked style="width: auto; margin: 0; cursor: pointer;">
                    <label for="pipeline-enable-organiser" style="font-weight: 500; cursor: pointer;">Bestanden sorteren met AI (Stap 2 activeren)</label>
                </div>

                <div id="pipeline-organiser-settings">
                    <div class="form-row vertical-row" style="margin-top: 12px;">
                        <label>Uiteindelijke Doelmap</label>
                        <div class="dir-row">
                            <div class="dir-path" id="pipeline-target-path">Select target folder...</div>
                            <button class="btn-browse" id="btn-pipeline-browse-target">Browse</button>
                            <input type="file" id="pipeline-target-input" webkitdirectory directory style="display: none;">
                        </div>
                    </div>
                    
                    <div class="form-row vertical-row" style="margin-top: 12px;">
                        <label for="pipeline-mode-select">Organisatiemethode</label>
                        <div class="media-type-select-wrapper">
                            <select id="pipeline-mode-select">
                                <option value="classic_periods" selected>Muziek - Klassieke Periodes (Standaard)</option>
                                <option value="artist_album">Muziek - Artiest / Album</option>
                                <option value="channel">Video - Kanaal / YouTuber</option>
                                <option value="flat">Geen submappen (Platte lijst)</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-row checkbox-row" style="margin-top: 16px;">
                        <input type="checkbox" id="pipeline-delete-source" checked>
                        <label for="pipeline-delete-source">Verplaatsen en tijdelijke bestanden opruimen</label>
                    </div>
                    
                    <div class="form-row checkbox-row" style="margin-top: 10px;">
                        <input type="checkbox" id="pipeline-use-shazam">
                        <label for="pipeline-use-shazam">Shazam Audio Fallback gebruiken</label>
                    </div>
                </div>
            </section>
        </div>
        
        <!-- Action triggers -->
        <div class="actions">
            <button class="btn-download btn-lg" id="btn-pipeline-start">Start Pipeline Workflow</button>
            <button class="btn-cancel" id="btn-pipeline-cancel" style="display: none;" disabled>Cancel</button>
        </div>
    </div>
    

    
    <!-- Right Column: Status info, Progress bars, and Console Logs -->
    <div class="output-panel" id="pipeline-progress-section" style="flex: 1.3;">
        <!-- Overall Status Card -->
        <section class="card overall-status-card status-idle" id="pipeline-status-card">
            <div class="progress-header">
                <div class="status-left-group">
                    <span class="status-dot" id="pipeline-status-dot"></span>
                    <span class="status-text" id="pipeline-status-text">Status: Idle</span>
                </div>
                <span class="track-text" id="pipeline-track-text"></span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="pipeline-progress-fill"></div>
            </div>
        </section>
        
        <!-- Track progress circular loaders -->
        <section class="card active-progress-container" id="pipeline-active-progress"></section>
        
        <!-- Console Logs card -->
        <div class="console" id="pipeline-console" role="log"></div>
    </div>
</div>

<!-- Playlist Preview Modal Popup -->
<div id="pipeline-preview-modal" class="modal-backdrop" style="display: none;">
    <div class="modal-content card">
        <div class="modal-header">
            <h3 class="modal-title">Afspeellijst Preview</h3>
            <button class="btn-close-modal" id="btn-pipeline-close-preview" aria-label="Close Preview">&times;</button>
        </div>
        <div class="modal-body">
            <div class="track-list-header" style="margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
                <span class="track-count" id="pipeline-track-count-text" style="font-weight: 600;">0 tracks found</span>
                <div style="display: flex; gap: 8px;">
                    <button class="btn-secondary btn-select" id="btn-pipeline-select-all">Alles selecteren</button>
                    <button class="btn-secondary btn-select" id="btn-pipeline-deselect-all">Niets selecteren</button>
                </div>
            </div>
            <!-- Track Checklist Container -->
            <div class="track-list-items" id="pipeline-track-list" style="position: relative; overflow-y: auto; max-height: 420px; min-height: 250px; border: 1px solid var(--border-default); border-radius: 6px; padding: 8px;">
                <!-- Populated dynamically -->
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-download btn-sm" id="btn-pipeline-confirm-preview">Bevestigen</button>
        </div>
    </div>
</div>
